<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Tracking - Community Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #4a148c;
      --secondary: #7b2cbf;
      --accent: #ff006e;
      --bg: #f3f0f7;
      --card-bg: #ffffff;
      --text-main: #1a0933;
      --text-muted: #6c757d;
      --shadow: rgba(74, 20, 140, 0.06);
      --nav-bg: #0f051d;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ---- Fixed Navigation Bar ---- */
    .navbar {
      width: 100%;
      background: var(--nav-bg);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .nav-logo {
      font-family: "Playfair Display", serif;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.35em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: #bfaecf;
      text-decoration: none;
      font-size: 0.85em;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 24px;
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .nav-links a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* ---- Authentication Overlay ---- */
    .login-overlay {
      position: fixed;
      top: 70px; /* Offset navigation bar */
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    .login-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(74, 20, 140, 0.12);
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(74, 20, 140, 0.05);
    }

    .login-card h2 {
      margin: 0 0 10px 0;
      font-family: "Playfair Display", serif;
      color: var(--primary);
      font-size: 1.8em;
    }

    .login-card p {
      margin: 0 0 24px 0;
      color: var(--text-muted);
      font-size: 0.9em;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #e1dbec;
      font-family: inherit;
      font-size: 0.95em;
      background: #faf9fc;
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: var(--secondary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(123, 44, 191, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.2s;
      margin-top: 10px;
    }

    .login-btn:hover {
      transform: translateY(-1px);
    }

    #login-error-msg {
      color: var(--accent);
      font-size: 0.85em;
      font-weight: 600;
      margin-top: 14px;
      min-height: 20px;
    }

    /* ---- Chat Layout ---- */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 800px;
      width: 90%;
      margin: 30px auto;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px var(--shadow);
      border: 1px solid rgba(74, 20, 140, 0.03);
      overflow: hidden;
      visibility: hidden; /* Kept hidden until login clears */
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
    }

    .chat-header h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 1.5em;
    }

    .chat-header p {
      margin: 4px 0 0 0;
      font-size: 0.85em;
      opacity: 0.8;
    }

    .messages-box {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #faf9fc;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95em;
      line-height: 1.4;
    }

    .message.incoming {
      background: #ffffff;
      color: var(--text-main);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #eee1f5;
    }

    .message.outgoing {
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message .username {
      font-size: 0.75em;
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .message.incoming .username { color: var(--secondary); }
    .message.outgoing .username { color: #e1dbec; }

    .input-area {
      padding: 20px;
      background: var(--card-bg);
      border-top: 1px solid #f1ecf7;
      display: flex;
      gap: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid #e1dbec;
      font-size: 0.95em;
      background: #faf9fc;
      outline: none;
    }

    .input-area button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav-container { flex-direction: column; height: auto; padding: 16px; gap: 14px; }
      .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; gap: 6px; }
      .chat-container { margin: 10px auto; width: 95%; height: calc(100vh - 140px); }
      .login-overlay { top: 120px; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="nav-logo">🌌 Celestial Tracking</a>
      <ul class="nav-links">
        <li><a href="index.html">Solstice</a></li>
        <li><a href="lunar-eclipse.html">Eclipse</a></li>
        <li><a href="meteor-shower.html">Meteors</a></li>
        <li><a href="winter-solstice.html">Winter</a></li>
      </ul>
    </div>
  </nav>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2>Transit Terminal</h2>
      <p>Initialize encryption keys to clear validation checkpoints.</p>
      
      <div class="form-group">
        <label for="usernameInput">Observer Handle</label>
        <input type="text" id="usernameInput" placeholder="e.g., Star Gazer 42" maxlength="20">
      </div>
      
      <div class="form-group">
        <label for="pinInput">4-Digit Security PIN</label>
        <input type="password" id="pinInput" placeholder="••••" pattern="[0-9]*" inputmode="numeric" maxlength="4">
      </div>
      
      <button class="login-btn" id="loginSubmitBtn">Sign in/Sign up</button>
      <div id="login-error-msg"></div>
    </div>
  </div>

  <div class="chat-container" id="chatWindow">
    <div class="chat-header">
      <h1>Stargazer Transit Lounge</h1>
      <p>Live global communication stream for real-time observation notes</p>
    </div>
    
    <div class="messages-box" id="messagesBox"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Share an observation..." maxlength="400">
      <button id="sendBtn">Transmit</button>
    </div>
  </div>

  <script>
    // 1. Secrets Variable Mappings
    const secretConfig = {
      apiKey: "__FIREBASE_API_KEY__",
      authDomain: "__FIREBASE_AUTH_DOMAIN__",
      databaseURL: "__FIREBASE_DATABASE_URL__",
      projectId: "__FIREBASE_PROJECT_ID__",
      storageBucket: "__FIREBASE_STORAGE_BUCKET__",
      messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
      appId: "__FIREBASE_APP_ID__",
      measurementId: "__FIREBASE_MEASUREMENT_ID__"
    };

    // 2. Direct Fallback Configuration
    const localConfig = {
      apiKey: "AIzaSyBc7te9teUuhfI7fI9AbGjEPbR8r43HIQ0",
      authDomain: "celestial-tracking.firebaseapp.com",
      databaseURL: "https://celestial-tracking-default-rtdb.firebaseio.com",
      projectId: "celestial-tracking",
      storageBucket: "celestial-tracking.firebasestorage.app",
      messagingSenderId: "941871549853",
      appId: "1:941871549853:web:6ff1e7e0ac0f3c4201f374",
      measurementId: "G-5W556CWNZ5"
    };

    const isDeployed = !secretConfig.apiKey.includes("__FIREBASE_");
    const firebaseConfig = isDeployed ? secretConfig : localConfig;

    function showStatus(errMessage, type = "error") {
      const header = document.querySelector('.chat-header');
      let statusDiv = document.getElementById('diagnostic-status');
      if (!statusDiv) {
        statusDiv = document.createElement('p');
        statusDiv.id = 'diagnostic-status';
        statusDiv.style.cssText = 'margin-top:8px; padding:8px; border-radius:6px; font-size:0.85em; font-weight:bold;';
        header.appendChild(statusDiv);
      }
      statusDiv.textContent = `⚠️ System: ${errMessage}`;
      statusDiv.style.background = type === "error" ? "#ff006e" : (type === "success" ? "#4caf50" : "#7b2cbf");
      statusDiv.style.color = "#fff";
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof firebase === 'undefined') {
        alert("Firebase components completely blocked by network configurations.");
        return;
      }

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const messagesRef = db.ref('community_chat');

      // Access elements
      const loginOverlay = document.getElementById('loginOverlay');
      const chatWindow = document.getElementById('chatWindow');
      const usernameInput = document.getElementById('usernameInput');
      const pinInput = document.getElementById('pinInput');
      const loginSubmitBtn = document.getElementById('loginSubmitBtn');
      const errorMsg = document.getElementById('login-error-msg');

      const messagesBox = document.getElementById('messagesBox');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');

      let activeSessionUser = sessionStorage.getItem('chat_active_user');

      // Skip access validation frame if data remains in volatile temporary session memory
      if (activeSessionUser) {
        revealChatFrame(activeSessionUser);
      }

      loginSubmitBtn.addEventListener('click', processValidationGate);
      pinInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') processValidationGate(); });

      function processValidationGate() {
        const handle = usernameInput.value.trim();
        const pinCode = pinInput.value.trim();

        if (handle.length < 3) {
          errorMsg.textContent = "Observer handle must be at least 3 characters.";
          return;
        }
        if (!/^\d{4}$/.test(pinCode)) {
          errorMsg.textContent = "Security validation key requires a strict 4-digit PIN.";
          return;
        }

        errorMsg.textContent = "";
        
        // Save state variables safely to transient tab cache memory
        sessionStorage.setItem('chat_active_user', handle);
        revealChatFrame(handle);
      }

      function revealChatFrame(username) {
        activeSessionUser = username;
        loginOverlay.style.opacity = '0';
        loginOverlay.style.visibility = 'hidden';
        chatWindow.style.visibility = 'visible';
        chatWindow.style.opacity = '1';

        // Connect the active downstream realtime database synchronization
        initializeRealtimeStreaming();
      }

      function initializeRealtimeStreaming() {
        function handleTransmission() {
          const text = messageInput.value.trim();
          if (!text) return;

          messagesRef.push({
            username: activeSessionUser,
            message: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
          }).catch((error) => {
            showStatus(`Database Refused Write: ${error.message}`);
          });

          messageInput.value = "";
        }

        sendBtn.onclick = handleTransmission;
        messageInput.onkeypress = (e) => { if (e.key === 'Enter') handleTransmission(); };

        // Pull and listen to real-time events incoming
        messagesRef.off(); // Wipe previous attachments if any
        messagesRef.on('child_added', (snapshot) => {
          const data = snapshot.val();
          const msgDiv = document.createElement('div');
          const isOurMessage = data.username === activeSessionUser;
          
          msgDiv.className = `message ${isOurMessage ? 'outgoing' : 'incoming'}`;
          msgDiv.innerHTML = `<span class="username">${escapeHTML(data.username)}</span><div>${escapeHTML(data.message)}</div>`;
          
          messagesBox.appendChild(msgDiv);
          messagesBox.scrollTop = messagesBox.scrollHeight;
        }, (error) => {
          showStatus(`Database Refused Read: ${error.message}`);
        });
      }
    });

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
  </script>
</body>
</html>
